<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bgGrad)" />
  
  <!-- Stylized Monogram P Path -->
  <path d="M160 120 H280 C340 120 380 155 380 215 C380 275 340 310 280 310 H220 V392 C220 403 211 412 200 412 H180 C169 412 160 403 160 392 V120 Z M220 180 V250 H275 C305 250 322 238 322 215 C322 192 305 180 275 180 H220 Z" fill="url(#pGrad)" />
  
  <!-- Glowing Dot Accent -->
  <circle cx="370" cy="380" r="28" fill="#38bdf8" filter="url(#glow)" />
</svg>